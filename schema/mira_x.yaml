# =============================================================================
# mira_x.yaml  —  MIRA-extraction overlay (the `mirax:` namespace)
# =============================================================================
# Imports the pinned MIRA schema (schema/vendor/mira.yaml @ main SHA f7d0449…) and
# adds what the build requires but core MIRA lacks. The DIFF between this file and
# vendor/mira.yaml *is* the schema-deltas list (SPEC §17). See SPEC §5.2.
#
# What this overlay adds:
#   1. Three status axes (enums): epistemic / activity-modality / curation.
#   2. Per-node/edge ENVELOPE: verbatim source span + provenance (+ content hash).
#   3. Identity layer: first-class Agent identities (researcher/org/funder/user),
#      authorship stamping (`creator` -> Agent), and `affiliatedWith` / `funds`.
#   4. Grouping: Bundle (the primitive) + an optional Narrative overlay that REFERENCES
#      a bundle (members by {ref, content_hash}; a narrative is NOT a Bundle subtype).
#   5. Reified relations: a single `Relation` class (edges are nodes; SPEC §10).
#   6. Slot-attachment fixes so CLOSED JSON-Schema validation accepts our output
#      (core mira.yaml defines relation slots globally but does not attach them to
#      Claim/Evidence/Argument).
#
# We bind STRICTLY to MIRA `main` — NO proposal-branch classes. (Criterion/Endorsement/
# Project/Grant were considered and dropped; v1 mission/CFP extracts to Questions only.)
#
# IMPORTANT — this is a DRAFT to be validated by `make schema` against the vendored
# files (run `make vendor` first; the vendor/ dir is not committed). Spots most
# likely to need calibration are flagged with `# CALIBRATE:` below.
#
# Pragmatic LinkML choices (documented so they're intentional, not accidental):
#   * Reference-valued slots (creator, source, destination, members.ref,
#     over_bundle, affiliated_with, request_*) use range `uriorcurie`
#     (a CURIE string), matching MIRA's own sampleData.json (which references nodes
#     by CURIE) and avoiding LinkML inlining ambiguity. Semantically these point at
#     Agents / nodes by @id.
#   * Envelope helper objects (SourceSpan, Provenance, Identifier, MemberRef,
#     Reference) are class-ranged and INLINED (nested objects), which is the LinkML
#     default for non-identified class ranges.
#   * Augmented discourse classes are RE-DECLARED in full (is_a/mixins/slots) so the
#     merged result is deterministic regardless of your LinkML version's class-merge
#     behavior. If your LinkML unions class attributes, the restated mixins/slots are
#     idempotent; if it replaces, the restatement is complete.
# =============================================================================

id: http://purl.org/mira-science/extraction
name: mira_x
title: MIRA-extraction overlay
description: >-
  Extension overlay over the MIRA LinkML schema for the MIRA-extraction pipeline.
  Adds grounding, provenance, status axes, first-class Agent identities, Bundle
  grouping (+ optional Narrative overlay), and reified relations. Binds strictly to
  MIRA `main` — no proposal-branch classes. The diff vs the
  vendored mira.yaml is the running schema-deltas proposal (SPEC §17).
license: MIT
see_also:
  - ../SPEC.md

prefixes:
  linkml: https://w3id.org/linkml/
  mira:  http://purl.org/mira-science/mira#
  mirax: http://purl.org/mira-science/extraction#
  dgb:   https://discoursegraphs.com/schema/dg_base#
  dct:   http://purl.org/dc/terms/
  sioc:  http://rdfs.org/sioc/ns#
  foaf:  http://xmlns.com/foaf/0.1/
  prov:  http://www.w3.org/ns/prov#
  schema: http://schema.org/
  xsd:   http://www.w3.org/2001/XMLSchema#

default_prefix: mirax
default_range: string

imports:
  - linkml:types          # datetime, integer, float, boolean, uriorcurie, ...
  - vendor/mira            # the pinned MIRA schema + its vendored import closure
                           # CALIBRATE: if `make vendor` writes elsewhere, fix this path.

# =============================================================================
# ENUMS  — the three status axes (SPEC §4.8) + grounding + identity discriminators
# =============================================================================
enums:

  EpistemicStatus:
    description: Epistemic axis — what kind of assertion this is (Decision 17).
    permissible_values:
      hypothesis:
        description: A proposed, not-yet-established assertion (e.g. "we hypothesize…").
      claim:
        description: An asserted generalized claim about the world.
      assumption:
        description: A premise taken as given without local justification.
      definition:
        description: A definitional or terminological statement.
      observation:
        description: A reported empirical observation (often on Evidence).

  ActivityModality:
    description: Activity-modality axis — separates proposed work from work done (Decision 17). Applies to Activity-typed nodes (Study/Protocol/Project).
    permissible_values:
      proposed:
        description: Future or planned work (e.g. "we will…" / "expected").
      in_progress:
        description: Work underway or preliminary.
      completed:
        description: Work already done or reported.

  CurationStatus:
    description: Curation axis — the human-in-the-loop lifecycle (Decision 17).
    permissible_values:
      ai_extracted:
        description: Produced by the pipeline; not yet reviewed.
      in_review:
        description: Flagged for human review (unverified grounding / low confidence / candidate link).
      expert_verified:
        description: Confirmed by a human curator.
      rejected:
        description: Rejected by a human curator (kept, not deleted — white-box).

  GroundingStatus:
    description: Whether a node's verbatim quote was located in the source text (SPEC §4.6).
    permissible_values:
      verified:
        description: Exact substring match located in source.
      fuzzy:
        description: Normalized or fuzzy match (rapidfuzz >= 0.92); confidence reduced.
      unverified:
        description: No match; kept + flagged + routed to in_review.

  GenerationMethod:
    description: PROV-style "how was this generated" (mirrors RRGI wasGeneratedBy); distinct from authorship (creator).
    permissible_values:
      manualAuthoring:
        description: Authored directly by a human.
      aiAssistedExtraction:
        description: Extracted from a document by the pipeline LLM.
      aiSuggested:
        description: Suggested by the pipeline (e.g. a candidate link).
      importedFromSource:
        description: Imported from an external API (e.g. OpenAlex / ORCID).

  AgentKind:
    description: What kind of identity an Agent represents (SPEC §8).
    permissible_values:
      researcher:
      organization:
      funder:
      user:
      entity:

  IdScheme:
    description: The identifier scheme for an Agent or external id.
    permissible_values:
      orcid:
        description: Researcher ORCID iD.
      ror:
        description: Organization ROR id.
      openalex:
        description: OpenAlex entity id.
      doi:
        description: DOI (for works).
      did:
        description: Decentralized Identifier (future / minted placeholder).
      minted:
        description: Locally minted placeholder id (DID-shaped) prior to a real DID.

# =============================================================================
# SLOTS
# =============================================================================
slots:

  # ---- Envelope: grounding + provenance + status (attached via the Grounded mixin) ----
  source_span:
    slot_uri: mirax:sourceSpan
    range: SourceSpan
    inlined: true
    description: Verbatim source span this node/edge is grounded in (SPEC §4.6).
  provenance:
    slot_uri: mirax:provenance
    range: Provenance
    inlined: true
    description: How/when/by-what this node/edge was produced (SPEC §4.1).
  epistemic_status:
    slot_uri: mirax:epistemicStatus
    range: EpistemicStatus
  activity_modality:
    slot_uri: mirax:activityModality
    range: ActivityModality
  curation_status:
    slot_uri: mirax:curationStatus
    range: CurationStatus
    ifabsent: "string(ai_extracted)"   # CALIBRATE: ifabsent enum syntax varies by linkml version.
  content_hash:
    slot_uri: mirax:contentHash
    range: string
    description: sha256 of the node's canonical JSON — the "version seal" (CID-role in bundle membership; SPEC §3.2/§4.9).

  # ---- Identity (SPEC §8) ----
  agent_kind:
    slot_uri: mirax:agentKind
    range: AgentKind
  identifier:
    slot_uri: mirax:identifier
    range: Identifier
    inlined: true
    description: The Agent's primary identifier (ORCID / ROR / DID / minted).
  external_ids:
    slot_uri: mirax:externalIds
    range: Identifier
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Additional identifiers (e.g. OpenAlex id alongside an ORCID).
  affiliated_with:
    slot_uri: mirax:affiliatedWith
    range: uriorcurie
    multivalued: true
    description: >-
      Compact convenience: the Agents (orgs) this Agent is affiliated with, by @id.
      CANONICAL form is the reified `Relation` (relation_type=mirax:affiliatedWith); SPEC §8/§10.

  # ---- Reified relation endpoints (edges are nodes; SPEC §10) ----
  relation_type:
    slot_uri: mirax:relationType
    range: uriorcurie
    description: The MIRA/mirax relation IRI this reified edge instantiates (e.g. mira:addresses, mirax:affiliatedWith).
  source:
    slot_uri: dgb:source
    range: uriorcurie
    description: Source endpoint (@id of the subject node).
  destination:
    slot_uri: dgb:destination
    range: uriorcurie
    description: Destination endpoint (@id of the object node).

  # ---- Bundle / Narrative (SPEC §4.9) ----
  members:
    slot_uri: mirax:members
    range: MemberRef
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: The set of member references that belong to this bundle (nodes, edges, or other bundles).
  over_bundle:
    slot_uri: mirax:overBundle
    range: uriorcurie
    multivalued: true
    description: The bundle(s) a Narrative is written OVER (it references them; a narrative is not a bundle).
  ref:
    slot_uri: mirax:ref
    range: uriorcurie
    description: The member's @id (URI-role; becomes an at:// URI under a future IPLD layer).
  prose:
    slot_uri: mirax:prose
    range: string
    description: Inline narrative prose (small narratives).
  prose_blob:
    slot_uri: mirax:proseBlob
    range: string
    description: Blob ref (sha256) to the narrative's full markdown prose (large narratives).
  abstract:
    slot_uri: mirax:abstract
    range: string
  references:
    slot_uri: mirax:references
    range: Reference
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Citation manifest mapping in-prose keys to cited records.
  ref_key:
    slot_uri: mirax:refKey
    range: string
    description: Stable in-prose citation key (convention - the cited node's local id).
  subject:
    slot_uri: mirax:subject
    range: MemberRef
    inlined: true
    description: The cited record (a member reference).
  ref_label:
    slot_uri: mirax:refLabel
    range: string
    description: Cached human-readable label for a cited record (cache; the live node is authoritative).

  # ---- Identifier helper ----
  id_scheme:
    slot_uri: mirax:idScheme
    range: IdScheme
  id_value:
    slot_uri: mirax:idValue
    range: string

  # ---- Provenance helper fields ----
  run_id:            { slot_uri: mirax:runId }
  backend:           { slot_uri: mirax:backend }
  model:             { slot_uri: mirax:model }
  fallback_path:     { slot_uri: mirax:fallbackPath, multivalued: true }
  prompt_id:         { slot_uri: mirax:promptId }
  prompt_sha:        { slot_uri: mirax:promptSha }
  schema_sha:        { slot_uri: mirax:schemaSha }
  chunk_id:          { slot_uri: mirax:chunkId }
  extracted_at:      { slot_uri: mirax:extractedAt, range: datetime }
  confidence:        { slot_uri: mirax:confidence, range: float }
  raw_completion_sha: { slot_uri: mirax:rawCompletionSha }
  was_generated_by:  { slot_uri: mirax:wasGeneratedBy, range: GenerationMethod }
  prov_source:       { slot_uri: mirax:provSource, description: "Data source for imported records (e.g. 'openalex', 'orcid')." }
  selection_basis:   { slot_uri: mirax:selectionBasis, description: "e.g. 'proposer_curated' | 'auto:top5_by_cited_by_count' (SPEC §7.4)." }

  # ---- SourceSpan helper fields ----
  quote:       { slot_uri: mirax:quote, description: "The VERBATIM source substring." }
  doc_id:      { slot_uri: mirax:docId }
  char_start:  { slot_uri: mirax:charStart, range: integer }
  char_end:    { slot_uri: mirax:charEnd, range: integer }
  page:        { slot_uri: mirax:page, range: integer }
  bbox:        { slot_uri: mirax:bbox, range: float, multivalued: true, description: "[left, top, right, bottom], TOPLEFT origin, page coords." }
  grounding:   { slot_uri: mirax:grounding, range: GroundingStatus }

# =============================================================================
# CLASSES
# =============================================================================
classes:

  # ----------------------------- Envelope helper objects -----------------------------
  SourceSpan:
    class_uri: mirax:SourceSpan
    description: A verbatim, offset-located span of source text (SPEC §4.1/§4.6).
    slots: [quote, doc_id, char_start, char_end, page, bbox, grounding]

  Provenance:
    class_uri: mirax:Provenance
    description: How/when/by-what a node or edge was produced (SPEC §4.1).
    slots:
      - run_id
      - backend
      - model
      - fallback_path
      - prompt_id
      - prompt_sha
      - schema_sha
      - chunk_id
      - extracted_at
      - confidence
      - raw_completion_sha
      - was_generated_by
      - prov_source
      - selection_basis

  Identifier:
    class_uri: mirax:Identifier
    description: A scheme+value identifier (e.g. {scheme orcid, value 0000-0002-1825-0097}).
    slots: [id_scheme, id_value]

  MemberRef:
    class_uri: mirax:MemberRef
    description: >-
      A bundle member reference. Prototype of RRGI's dual-addressed strongRef {uri, cid}:
      `ref` is the URI-role (member @id), `content_hash` is the CID-role (exact version seal).
    slots: [ref, content_hash]

  Reference:
    class_uri: mirax:Reference
    description: A narrative citation-manifest entry (key -> cited record).
    slots: [ref_key, subject, ref_label]

  # ----------------------------- Mixins -----------------------------
  Grounded:
    mixin: true
    class_uri: mirax:Grounded
    description: >-
      Attaches the per-node/edge envelope (source span + provenance + status axes +
      content hash + author identity). Mixed into every discourse node and into Relation.
    slots:
      - title              # imported (dct:title) — MIRA sampleData uses title on nodes/relations
      - source_span
      - provenance
      - epistemic_status
      - activity_modality
      - curation_status
      - content_hash
      - creator            # imported (dct:creator); refined to Agent below
    slot_usage:
      creator:
        range: uriorcurie  # @id of the author Agent (the identity BEHIND the node). SPEC §4.10.
        multivalued: false
        description: Author identity (ORCID/ROR/DID Agent @id). Normalizes MIRA's creator->UserAccount indirection.

  # ----------------------------- Identity layer (SPEC §8) -----------------------------
  Agent:
    class_uri: dgb:Agent
    is_a: FoafAgent            # imported (sioc.yaml); MIRA's Agent is_a FoafAgent
    description: >-
      A first-class identity — researcher, organization, funder, user, or entity —
      identified by ORCID/ROR/DID. Authors discourse nodes (via `creator`) and relates to
      other agents (`affiliatedWith`, `funds`). NOT a discourse node. (Decision-9 revision; SPEC §8.)
    slots:
      - name                  # imported (foaf:name)
      - account               # imported (foaf:account)
      - agent_kind
      - identifier
      - external_ids
      - affiliated_with

  # ----------------------------- Grouping (SPEC §4.9) -----------------------------
  Bundle:
    class_uri: mirax:Bundle
    description: >-
      A node naming a flat, unordered SET of members (discourse nodes, edges, or other
      bundles). One bundle per ingested document keeps its exploded nodes grouped.
      Borrowed from RRGI's `bundle`; maps upstream to MIRA's Container/container_of.
    slots:
      - name                  # imported (foaf:name) — bundle label
      - members
      - description           # imported (dct:description) — rationale for grouping (NOT prose)
      - content_hash
      - curation_status
      - provenance
      - created               # imported (dct:created)
      - creator               # imported; refined below
    slot_usage:
      creator:
        range: uriorcurie
        multivalued: false
        description: Author identity (@id) of this bundle.

  Narrative:
    class_uri: mirax:Narrative
    description: >-
      OPTIONAL prose overlay written OVER one or more bundles — it REFERENCES them via `over_bundle`;
      it is NOT itself a bundle and NOT a Bundle subtype. De-emphasized in v1: BUNDLES are the grouping
      primitive; a narrative merely layers prose on top of a bundle. (RRGI seed note: "a narrative is
      formed out of one or more bundles.")
    slots:
      - over_bundle
      - prose
      - prose_blob
      - abstract
      - references
      - creator
      - provenance
      - created
    slot_usage:
      creator:
        range: uriorcurie
        multivalued: false
        description: Author identity (@id) of this narrative overlay.

  # ----------------------------- Reified relations (edges as nodes; SPEC §10) -----------------------------
  Relation:
    class_uri: mirax:Relation
    mixins: [Grounded]
    description: >-
      A reified edge. Emitted as a node typed [mirax:Relation, <relation IRI>] with
      relation_type set to the specific MIRA/mirax relation (mira:addresses, mira:supports,
      mirax:affiliatedWith, mira:funds, ...). Carries its own envelope so relations are grounded.
      (MIRA reifies relations in sampleData.json; SPEC §10.)
    slots:
      - relation_type
      - source
      - destination

  # (No funder-side proposal-branch classes. Criterion/Endorsement/Project/Grant were dropped —
  #  v1 binds STRICTLY to MIRA `main` + our own generic extensions (envelope/identity/bundles).
  #  Mission/CFP extracts to Questions only; see SPEC §7.3. If funder "criteria" are ever needed,
  #  add Criterion back as a single flagged delta — it is the only one that was load-bearing.)

  # ----------------------------- Augmented discourse classes -----------------------------
  # Re-declared in full (is_a/mixins/slots) for deterministic merge. Adds the Grounded mixin
  # and ATTACHES the relation slots that core mira.yaml leaves globally-defined-but-unattached
  # (so closed JSON-Schema validation accepts our output). SPEC §5.2 / §17.

  Question:
    class_uri: mira:Question
    mixins: [NodeSchema, Grounded]
    slots: [addressedBy]        # inverse of addresses (imported)
    description: Scientific unknowns addressable by research methods.

  Claim:
    class_uri: mira:Claim
    mixins: [NodeSchema, Argument, Grounded]   # Argument mixin -> claims can support/oppose (cf. discoursegraphs.yaml)
    slots: [addresses, supportedBy, opposedBy]  # all imported from mira.yaml
    description: Atomic, generalized assertions that (propose to) answer research questions.

  Evidence:
    class_uri: mira:Evidence
    mixins: [NodeSchema, Argument, Grounded]
    slots:
      - observationStatement
      - observationOriginActivity
      - observationBase
      - sourceDocument
      - is_grounded_in
    description: A specific empirical observation from a particular application of a research method.

  Study:
    class_uri: mira:Study
    mixins: [NodeSchema, Activity, Grounded]
    slots: [follows, grounds]
    description: A research activity that follows protocols and grounds evidence.

  Protocol:
    class_uri: mira:Protocol
    mixins: [NodeSchema, Activity, Grounded]
    description: A research method/procedure a study follows.

  Request:
    class_uri: mira:Request
    mixins: [NodeSchema, Grounded]
    slots: [request_for, request_target]
    description: A request for a study to be performed / a claim to be established (models a proposal's ask, a CFP).

  Argument:
    class_uri: mira:Argument
    mixin: true
    slots: [supports, opposes]   # imported; restated for determinism
    description: A node that can support or oppose another node.

  SourceDocument:
    class_uri: mira:SourceDocument
    is_a: CreativeWork
    mixins: [NodeSchema, Grounded]
    description: A research source document (book, paper, dataset, report) that reports/generates evidence.
